<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Songster</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1><a href="{{ url_for('song.index') }}">Songster</a></h1>
        <div class="header-controls">
            <nav>
                <a href="{{ url_for('song.index') }}">Songs</a>
                <a href="{{ url_for('song.search') }}">Search</a>
                <a href="{{ url_for('song.new_song') }}">Add song</a>
            </nav>

            <form method="POST" action="{{ url_for('song.select_user') }}" class="user-switcher">
                <label for="user_id">Current user</label>
                <select id="user_id" name="user_id" onchange="this.form.submit()">
                    {% for user_id in available_users %}
                        <option value="{{ user_id }}" {% if user_id == current_user_id %}selected{% endif %}>
                            User {{ user_id }}
                        </option>
                    {% endfor %}
                </select>
            </form>
        </div>
    </header>

    <main>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="flash-messages">
                    {% for category, message in messages %}
                        <p class="flash flash-{{ category }}">{{ message }}</p>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>
    <script>
    setTimeout(() => {
        document.querySelectorAll(".flash").forEach((message) => {
            message.remove();
        });
    }, 5000);
    </script>
</body>
</html>
